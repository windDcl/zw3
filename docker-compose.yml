services:
  mysql:
    image: mysql:8.4
    container_name: govqa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: gov_qa
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p12345678 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.26
    container_name: govqa-neo4j
    environment:
      NEO4J_AUTH: neo4j/12345678
      TZ: Asia/Shanghai
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./sql/init-graph-data.cypher:/init-graph-data.cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  neo4j-init:
    image: neo4j:5.26
    container_name: govqa-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_AUTH: neo4j/12345678
    volumes:
      - ./sql/init-graph-data.cypher:/init-graph-data.cypher:ro
    entrypoint:
      - sh
      - -c
      - |
        for i in 1 2 3 4 5 6 7 8; do
          cat /init-graph-data.cypher | cypher-shell -a neo4j:7687 -u neo4j -p 12345678 && exit 0
          echo "Attempt $$i failed, retrying..."
          sleep 5
        done
        exit 1
    restart: "no"

  nlp:
    build:
      context: ./nlp-service
    container_name: govqa-nlp
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: govqa-backend
    depends_on:
      mysql:
        condition: service_healthy
      nlp:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gov_qa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345678
      APP_NLP_BASE_URL: http://nlp:8000
      APP_GRAPH_ENABLED: "true"
      APP_GRAPH_URI: bolt://neo4j:7687
      APP_GRAPH_USERNAME: neo4j
      APP_GRAPH_PASSWORD: 12345678
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: govqa-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  neo4j_data:
